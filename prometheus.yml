global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'app-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:8080']

  - job_name: 'auth-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['auth-service:3000']

  - job_name: 'log-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['log-service:4000']
