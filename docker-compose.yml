services:
  # ─────────────────────────────────────────────────────────────────────────
  # Redis — banco de dados do log-service (Redis Streams)
  # ─────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - tomhanks-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Microsserviço de log e auditoria — Persiste em Redis Streams
  # ─────────────────────────────────────────────────────────────────────────
  log-service:
    build:
      context: .
      dockerfile: Dockerfile.log
    environment:
      REDIS_URL: redis://redis:6379/0
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-internal-change-me}
      LOG_PORT: 4000
      MAX_LOG_ENTRIES: 10000
    depends_on:
      - redis
    networks:
      - tomhanks-net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:4000/health\")' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # MinIO — Object Storage para fotos de perfil (Atividade 6)
  # ─────────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - tomhanks-net
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Microsserviço de autenticação
  # ─────────────────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.auth
    environment:
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-auth-change-me}
      AUTH_PORT: 3000
      AUTH_ADMIN_NAME: ${AUTH_ADMIN_NAME:-Administrador}
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL:-}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-tomhanks-avatars}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000/tomhanks-avatars}
      SMTP_HOST: ${SMTP_HOST:-sandbox.smtp.mailtrap.io}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-starttls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@tomhanks.local}
      PASSWORD_RESET_EXPOSE_LINK: ${PASSWORD_RESET_EXPOSE_LINK:-0}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-internal-change-me}
      LOG_SERVICE_URL: http://log-service:4000
    depends_on:
      - log-service
      - minio
    networks:
      - tomhanks-net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:3000/health\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Catálogo de filmes — único ponto de entrada público
  # ─────────────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-change-me}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-pt-BR}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      PORT: ${PORT:-8080}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-tomhanks-avatars}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000/tomhanks-avatars}
      AUTH_SERVICE_URL: http://auth-service:3000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-internal-change-me}
      LOG_SERVICE_URL: http://log-service:4000
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    depends_on:
      - auth-service
      - log-service
      - minio
    networks:
      - tomhanks-net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080/api/health\")' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Prometheus — Coleta e armazenamento de métricas (Atividade Observabilidade)
  # ─────────────────────────────────────────────────────────────────────────
  prometheus:
    build:
      context: .
      dockerfile: Dockerfile.prometheus
    ports:
      - "9091:9090"
    networks:
      - tomhanks-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Grafana — Visualização e dashboards de observabilidade
  # ─────────────────────────────────────────────────────────────────────────
  grafana:
    build:
      context: .
      dockerfile: Dockerfile.grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    networks:
      - tomhanks-net
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  tomhanks-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.201.0.0/24

volumes:
  redis-data:
  minio-data:
