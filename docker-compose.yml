services:
  # ─────────────────────────────────────────────────────────────────────────
  # Redis — banco de dados do log-service (Redis Streams)
  # Sem porta publicada — só acessível na rede interna
  # ─────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    # Sem "ports:" — invisível para o host, apenas na rede interna
    networks:
      - tomhanks-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Microsserviço de log e auditoria — NÃO publica porta para o host
  # Acessível internamente pelo nome "log-service" na rede Docker
  # Persiste eventos em Redis Streams (XADD / XRANGE)
  # ─────────────────────────────────────────────────────────────────────────
  log-service:
    build:
      context: .
      dockerfile: Dockerfile.log
    environment:
      REDIS_URL: redis://redis:6379/0
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-internal-change-me}
      LOG_PORT: 4000
      MAX_LOG_ENTRIES: 10000
    # Sem "ports:" — serviço invisível para o host, apenas na rede interna
    depends_on:
      - redis
    networks:
      - tomhanks-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # MinIO — Object Storage para fotos de perfil (Atividade 6)
  # ─────────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - tomhanks-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Microsserviço de autenticação — NÃO publica porta para o host
  # Acessível internamente pelo nome "auth-service" na rede Docker
  # ─────────────────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.auth
    environment:
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-auth-change-me}
      AUTH_PORT: 3000
      AUTH_ADMIN_NAME: ${AUTH_ADMIN_NAME:-Administrador}
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL:-}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-}
      # Banco de dados (compartilhado ou separado — usa as mesmas variáveis)
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # MinIO Object Storage
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-tomhanks-avatars}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000/tomhanks-avatars}
      # E-mail (Mailtrap para desenvolvimento)
      SMTP_HOST: ${SMTP_HOST:-sandbox.smtp.mailtrap.io}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-starttls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@tomhanks.local}
      PASSWORD_RESET_EXPOSE_LINK: ${PASSWORD_RESET_EXPOSE_LINK:-0}
      # URL do frontend para montar o link de reset
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      # Token interno para chamadas catálogo → auth-service e log-service
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-internal-change-me}
      # URL interna do log-service
      LOG_SERVICE_URL: http://log-service:4000
    # Sem "ports:" — serviço invisível para o host, apenas na rede interna
    depends_on:
      - log-service
      - minio
    networks:
      - tomhanks-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Catálogo de filmes — único ponto de entrada público
  # ─────────────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-change-me}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-pt-BR}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      PORT: ${PORT:-8080}
      # MinIO Object Storage
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-tomhanks-avatars}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000/tomhanks-avatars}
      # URL interna do auth-service (pelo nome do serviço Docker)
      AUTH_SERVICE_URL: http://auth-service:3000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-internal-change-me}
      # URL interna do log-service
      LOG_SERVICE_URL: http://log-service:4000
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    depends_on:
      - auth-service
      - log-service
      - minio
    networks:
      - tomhanks-net
    restart: unless-stopped

networks:
  tomhanks-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.200.200.0/28

volumes:
  redis-data:
  minio-data:
